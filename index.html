<style>
:root{
  --bg:#E6FFF6; --dot:#B8F2DF; --surface:#FFFFFF; --ink:#101A17; --muted:#4A5E58; --edge:#101A17;
  --mint:#1DE9B6; --mint-soft:#CFFCEB; --yellow:#FFE45C; --yellow-soft:#FFF5BF; --pink:#FF8CC6; --pink-soft:#FFE0F0;
  --sky-soft:#DDEBFF;
  --e:#8EC5FF; --b:#B6F26A; --s:#FF9F7A; --i:#FFDF4A; --tile-ink:#101A17;
  --btn:#1DE9B6; --btn-ink:#101A17;
  --hard:4px 4px 0 var(--edge);
  --font-display:"Black Han Sans","Pretendard Variable",sans-serif;
  --font-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1714; --dot:#16302A; --surface:#14231F; --ink:#EEFFF8; --muted:#A6C4BC; --edge:#000000;
    --mint-soft:#103A2F; --yellow-soft:#3A3412; --pink-soft:#3D1A2D; --sky-soft:#18273D;
    --hard:4px 4px 0 #1DE9B6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1714; --dot:#16302A; --surface:#14231F; --ink:#EEFFF8; --muted:#A6C4BC; --edge:#000000;
  --mint-soft:#103A2F; --yellow-soft:#3A3412; --pink-soft:#3D1A2D; --sky-soft:#18273D;
  --hard:4px 4px 0 #1DE9B6; color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:18px 18px;color:var(--ink);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:18px 16px 44px;min-height:100dvh;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:18px;flex:1;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}70%{transform:scale(1.06) rotate(2deg)}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
p{margin:0}
h1,h2{margin:0;text-wrap:balance}
.disp{font-family:var(--font-display);font-weight:400;letter-spacing:-.01em}
.chip{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;background:var(--yellow);color:var(--tile-ink);border:2px solid var(--edge);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;box-shadow:2px 2px 0 var(--edge);transform:rotate(-2deg)}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,9.6vw,46px);line-height:1.12}
.hl{background:linear-gradient(transparent 58%,var(--mint) 58%,var(--mint) 92%,transparent 92%);padding:0 2px}
h2{font-size:17px;font-weight:800;line-height:1.45}
.lede{color:var(--muted);font-size:15px}
.fine{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:2.5px solid var(--edge);border-radius:22px;box-shadow:var(--hard);padding:18px}
.btn{display:block;width:100%;padding:17px;border-radius:18px;background:var(--btn);color:var(--btn-ink);font-size:19px;font-weight:800;text-align:center;border:2.5px solid var(--edge);box-shadow:var(--hard);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.btn.ghost{background:var(--surface);color:var(--ink);font-size:16px}
.btn.big{font-family:var(--font-display);font-weight:400;font-size:24px;padding:18px}

/* compass */
.axis{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:0 2px}
.compass{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{position:relative;border:2.5px solid var(--edge);border-radius:20px;padding:12px;display:flex;flex-direction:column;min-height:150px;color:var(--tile-ink);overflow:hidden}
.q b{font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1}
.q .ch{position:absolute;right:4px;top:6px;width:64px}
.q span{margin-top:auto;font-size:15px;font-weight:800}
.q small{font-size:11.5px;font-weight:600;opacity:.75}
.q.B .ch,.q.I .ch{right:auto;left:4px}
.q.B,.q.I{align-items:flex-end;text-align:right}

/* book */
.book{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--sky-soft)}
.book .ic{font-size:34px;line-height:1}
.book .bt{font-weight:800;font-size:15.5px}
.nosp{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--edge)}

/* question */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--edge);font-size:14px;font-weight:700}
.count{font-family:var(--font-display);font-size:20px}
.track{height:14px;border-radius:999px;background:var(--surface);border:2px solid var(--edge);overflow:hidden}
.fill{height:100%;background:var(--mint);border-right:2px solid var(--edge);transition:width .3s ease}
.qtext{font-size:23px;font-weight:900;line-height:1.4;letter-spacing:-.02em;padding-top:4px}
.qsub{font-size:13px;color:var(--muted);font-weight:600}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2.5px solid var(--edge);box-shadow:var(--hard);border-radius:18px;padding:14px 14px;font-size:15.5px;font-weight:600;line-height:1.45;transition:transform .08s,box-shadow .08s,background .12s}
.opt i{flex:none;font-style:normal;width:30px;height:30px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--font-display);font-size:15px;background:var(--bg)}
.opt:active,.opt.picked{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge);background:var(--mint);color:var(--tile-ink)}
.opt.picked i{background:var(--surface);color:var(--ink)}

/* result: share card */
.rcard{position:relative;border:3px solid var(--edge);border-radius:28px;box-shadow:6px 6px 0 var(--edge);padding:22px 20px 18px;color:var(--tile-ink);text-align:center;overflow:hidden;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
.rcard .me{font-weight:800;font-size:14px;background:rgba(255,255,255,.7);border:2px solid var(--tile-ink);border-radius:999px;padding:2px 12px;display:inline-block}
.rcard .chars{display:flex;justify-content:center;gap:4px;margin:8px 0 2px}
.rcard .chars svg{width:150px;animation:bob 2.4s ease-in-out infinite}
.rcard .chars.two svg{width:120px}
.rcard .chars.two svg:nth-child(2){animation-delay:.4s}
.rcard .letter{font-family:var(--font-display);font-size:30px;line-height:1}
.rcard .title{font-family:var(--font-display);font-size:clamp(25px,7.6vw,31px);line-height:1.2;margin-top:6px}
.rcard .en{font-size:13px;font-weight:700;opacity:.75;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.tags span{background:var(--tile-ink);color:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700}
.rcard .wm{margin-top:14px;font-size:11.5px;font-weight:700;opacity:.7}
.one{font-size:15.5px;font-weight:600}

.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-direction:column;gap:5px;font-size:13px}
.bl{display:flex;align-items:baseline;gap:8px}
.bl b{font-family:var(--font-display);font-weight:400;font-size:20px;width:18px}
.bl span{flex:1;font-weight:700}
.bl span small{color:var(--muted);font-weight:500}
.bl em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.tr{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--edge);overflow:hidden}
.tr i{display:block;height:100%;border-right:2px solid var(--edge);transition:width .7s cubic-bezier(.2,.9,.3,1)}
.tr i[data-w="0"]{border-right:0}
.sec-title{font-family:var(--font-display);font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-title .em{font-size:22px}

/* result: distinct sections */
.typehead{display:flex;align-items:center;gap:10px;border:2.5px solid var(--edge);border-radius:18px;padding:10px 14px;color:var(--tile-ink);box-shadow:var(--hard)}
.typehead svg{width:44px;flex:none}
.typehead b{font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.2}
.s-good{background:var(--mint-soft)}
.s-watch{background:var(--yellow-soft)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:15px}
.list li{display:flex;gap:9px}
.list li::before{content:var(--mark);flex:none;font-size:15px}
.s-good .list{--mark:"✔︎"}
.s-watch .list{--mark:"👀"}
.s-guide{background:var(--sky-soft)}
.guides{display:flex;flex-direction:column;gap:10px}
.guide{background:var(--surface);border:2px solid var(--edge);border-radius:16px;padding:12px 14px}
.gh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.gh i{flex:none;font-style:normal;width:34px;height:34px;border-radius:10px;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--font-display);font-size:19px;color:var(--tile-ink)}
.gh span{display:flex;flex-direction:column;line-height:1.3}
.gh b{font-size:15px;font-weight:800}
.gh small{font-size:12.5px;color:var(--muted);font-weight:600}
.gh .full{font-style:normal;font-size:12.5px;font-weight:800;color:var(--ink);opacity:.75}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.mission{margin:0;background:var(--surface);border:2.5px dashed var(--edge);border-radius:18px;padding:16px;font-size:15px;font-weight:600}

.prio{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px}
.prio ol{margin:6px 0 0;padding-left:18px;font-weight:600}
.prio div{border:2px solid var(--edge);border-radius:14px;padding:12px}
.prio div:first-child{background:var(--bg)}
.prio div:last-child{background:var(--yellow-soft)}
.prio h3{font-size:13px;margin:0;font-weight:800}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.follow{display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center;text-decoration:none;color:inherit;background:var(--mint-soft)}
.follow .nm{font-family:var(--font-display);font-size:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
// 결과 화면 맨 아래 '팔로우하기' 링크가 여는 인스타그램 아이디 (@ 빼고)
const IG_HANDLE = "youbean.ko";

// 각 선택지는 E(봉급생활자)·S(자영업·전문직)·B(사업 시스템 소유)·I(투자자) 중 하나에 1점.
// 근거: 『부자 아빠의 리치 패밀리』 3강 — 각 사분면 사람들이 자주 쓰는 말·중요하게 여기는 것.
const QS = [
  {q:"새벽 수유하다가 문득 드는 돈 생각은?", o:[
    ["E","복직하면 내 자리, 내 월급 그대로 있겠지?"],
    ["S","내 실력이면 프리랜서로 시간당 얼마 받을 수 있을까"],
    ["B","육아하며 불편했던 이거, 서비스로 만들면 되겠는데?"],
    ["I","내가 자는 동안에도 내 돈은 어디선가 일하고 있겠지"]]},
  {q:"아기 낮잠으로 2시간이 생겼다!", o:[
    ["E","자격증 공부나 채용 공고 확인"],
    ["S","밀린 부업 일감 처리. 내가 해야 제일 빠르고 정확함"],
    ["B","혼자 다 하던 일 중 남에게 맡길 수 있는 걸 정리"],
    ["I","경제 뉴스 보고, 넣어둔 것들 수익률 확인"]]},
  {q:"일하면서 들으면 제일 기분 좋은 말은?", o:[
    ["E","“이번에 연봉 인상 확정됐어요”"],
    ["S","“역시 당신 아니면 이거 못 해요”"],
    ["B","“대표님 안 계셔도 팀이 알아서 잘 돌아가요”"],
    ["I","“투자 얘기는 다들 ○○님한테 물어보더라고요”"]]},
  {q:"돌잔치 축하금이 꽤 들어왔다. 어떻게 할까?", o:[
    ["E","아이 이름으로 적금 들어서 꼬박꼬박 쌓기"],
    ["S","아이만의 특기 하나 키워줄 교육비로 따로 떼두기"],
    ["B","전문가랑 상의해서 아이 돈이 굴러갈 구조부터 짜기"],
    ["I","아이 계좌로 오래 묵혀둘 자산을 사두기"]]},
  {q:"육아휴직 등으로 수입이 줄어든다면, 제일 먼저 드는 생각은?", o:[
    ["E","매달 같은 날 들어오던 월급이 제일 아쉬울 것 같다"],
    ["S","내가 손을 놓으면 수입도 바로 멈출 텐데… 그게 제일 불안하다"],
    ["B","나 대신 일을 굴려줄 사람이나 팀이 있으면 좋겠다"],
    ["I","모아둔 돈이 이자·배당이라도 벌어주면 좋겠다"]]},
  {q:"지인이 ‘나 사업(투자) 시작했어’라고 하면 내 첫마디는?", o:[
    ["E","“괜찮아? 그거 위험하지 않아?”"],
    ["S","“그거 네가 직접 다 해야 할 텐데, 시간 돼?”"],
    ["B","“누구랑 같이 해? 팀은 어떻게 꾸렸어?”"],
    ["I","“그래서 들어간 돈 대비 얼마나 남아?”"]]},
  {q:"연말정산·세금 시즌, 나의 모습은?", o:[
    ["E","공제 항목 꼼꼼히 챙겨서 회사 연말정산에 맞춰 제출"],
    ["S","영수증 모아서 종합소득세 내가 직접 신고"],
    ["B","세금은 세무사가 알아서 챙겨줌"],
    ["I","절세되는 계좌 한도부터 챙김"]]},
  {q:"여윳돈이 생기면 제일 먼저 하는 건?", o:[
    ["E","비상금·저축 통장에 넣어 안전하게"],
    ["S","내 실력 키우는 강의나 장비에 투자"],
    ["B","나 대신 일해줄 사람이나 자동화 도구에 쓰기"],
    ["I","내 자산 목록에 하나 더 추가"]]},
  {q:"아이가 커서 ‘돈은 어떻게 벌어?’ 하고 물으면?", o:[
    ["E","“회사에서 맡은 일을 하면 매달 월급을 받아”"],
    ["S","“내가 잘하는 기술로 일해주고 그 값을 받아”"],
    ["B","“가게나 회사를 만들어서 사람들이 일하게 하면 돼”"],
    ["I","“모아둔 돈을 잘 심어두면 그 돈이 또 돈을 벌어와”"]]},
  {q:"딱 1년, 아이한테만 집중해야 한다면 우리 집 수입은?", o:[
    ["E","휴직 급여 받고 복직만 보장되면 버틸 수 있음"],
    ["S","솔직히 거의 멈춤. 그게 제일 걱정"],
    ["B","내가 만든 팀·시스템이 대신 벌어줌"],
    ["I","투자에서 나오는 돈이 생활비 일부를 받쳐줌"]]},
];

const TYPES = {
  E:{name:"안정 설계형 엄빠", en:"Employee · 봉급생활자",
    tags:["#월급은_소중해","#꾸준함이_무기","#복지_만렙"],
    one:"고용 안정성, 낮은 위험, 꾸준한 수입을 가장 중요하게 여기는 타입.",

// 다른 사분면으로 옮겨 가고 싶을 때의 출발점 (책 3강의 사분면별 특징 기반, 특정 상품·투자 권유 아님)
const GUIDE = {
  E:{key:"조직 안에서 안정적으로 버는 쪽", steps:["경력이 끊기지 않게 쓸 수 있는 자격·경력부터 쌓기","육아휴직·복지 제도를 꼼꼼히 확인하고 챙기기","매달 고정 수입을 기준으로 가계 예산 세우기"]},

const ORDER = ["E","B","S","I"]; // 책의 사분면 배치: 왼쪽 위 E, 오른쪽 위 B, 왼쪽 아래 S, 오른쪽 아래 I
const COLOR = {E:"var(--e)",S:"var(--s)",B:"var(--b)",I:"var(--i)"};

// 유형별 캐릭터: 같은 동글이 몸에 소품만 다르게 (E 사원증, S 망치·머리띠, B 왕관, I 새싹·동전)
function charSVG(k){
  const ink="#101A17", body={E:"#8EC5FF",S:"#FF9F7A",B:"#B6F26A",I:"#FFDF4A"}[k];
  const props = {
    E:`<path d="M40 74 L50 84 L60 74" fill="none" stroke="#E5484D" stroke-width="3"/>
       <rect x="43" y="82" width="14" height="12" rx="2.5" fill="#fff" stroke="${ink}" stroke-width="2.5"/>
       <rect x="46" y="85" width="8" height="3" rx="1" fill="${ink}"/>`,
    S:`<path d="M17 40 Q50 26 83 40 L81 48 Q50 35 19 48Z" fill="#fff" stroke="${ink}" stroke-width="2.5"/>
       <circle cx="50" cy="35" r="4" fill="#E5484D" stroke="${ink}" stroke-width="2"/>
       <line x1="88" y1="86" x2="96" y2="60" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>
       <rect x="87" y="52" width="16" height="10" rx="2" fill="#9AA5B1" stroke="${ink}" stroke-width="2.5" transform="rotate(18 95 57)"/>`,
    B:`<path d="M32 26 L36 8 L44 18 L50 5 L56 18 L64 8 L68 26Z" fill="#FFDF4A" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>
       <circle cx="50" cy="14" r="2.5" fill="#E5484D"/>`,
    I:`<path d="M50 22 L50 8" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>
       <ellipse cx="42" cy="9" rx="8" ry="4.5" fill="#3DDC84" stroke="${ink}" stroke-width="2.2" transform="rotate(-25 42 9)"/>
       <ellipse cx="58" cy="9" rx="8" ry="4.5" fill="#3DDC84" stroke="${ink}" stroke-width="2.2" transform="rotate(25 58 9)"/>
       <circle cx="88" cy="80" r="11" fill="#FFC21A" stroke="${ink}" stroke-width="2.5"/>
       <text x="88" y="85" text-anchor="middle" font-size="13" font-weight="900" fill="${ink}" font-family="sans-serif">₩</text>`,
  }[k];
  const behind = k==="B"||k==="I" ? props : "";
  const front  = k==="B"||k==="I" ? "" : props;
  return `<svg viewBox="0 0 106 100" aria-hidden="true">
    ${behind}
    <path d="M50 20 C79 20 92 42 92 64 C92 86 75 96 50 96 C25 96 8 86 8 64 C8 42 21 20 50 20Z" fill="${body}" stroke="${ink}" stroke-width="3"/>
    <ellipse cx="37" cy="58" rx="4.6" ry="5.6" fill="${ink}"/><circle cx="38.6" cy="56" r="1.6" fill="#fff"/>
    <ellipse cx="63" cy="58" rx="4.6" ry="5.6" fill="${ink}"/><circle cx="64.6" cy="56" r="1.6" fill="#fff"/>
    <ellipse cx="27" cy="69" rx="6" ry="3.6" fill="#FF8CC6" opacity=".8"/><ellipse cx="73" cy="69" rx="6" ry="3.6" fill="#FF8CC6" opacity=".8"/>
    <path d="M44 68 Q50 75 56 68" fill="none" stroke="${ink}" stroke-width="2.8" stroke-linecap="round"/>
    ${front}
  </svg>`;
}

function ask(i){
  const item = QS[i];
  const opts = item.o.map(o=>({k:o[0],t:o[1]})).sort(()=>Math.random()-.5);
  app.innerHTML = `
  <section class="screen">
    <div class="top">
      <button class="back" id="back">← ${i===0?"처음으로":"이전"}</button>
      <span class="count">${i+1} / ${QS.length}</span>
    </div>
    <div class="track"><div class="fill" style="width:${((i+1)/QS.length)*100}%"></div></div>
    <p class="qtext">Q${i+1}. ${esc(item.q)}</p>
    <p class="qsub">가장 가까운 하나를 골라주세요</p>
    <div class="opts">
      ${opts.map((o,j)=>`<button class="opt${answers[i]===o.k?" picked":""}" data-k="${o.k}"><i>${j+1}</i><span>${esc(o.t)}</span></button>`).join("")}
    </div>
  </section>`;
  document.getElementById("back").onclick = () => i===0 ? intro() : ask(i-1);
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    app.querySelectorAll(".opt").forEach(x=>x.classList.remove("picked"));
    b.classList.add("picked");
    answers[i] = b.dataset.k;
    setTimeout(() => i+1 < QS.length ? ask(i+1) : result(), 180);
  });
  window.scrollTo(0,0);
}

function result(){

      <p class="nm">동글마미</p>
      <p style="font-size:14.5px">25년생 딸 키우는 직장인 엄마예요. 육아하면서 궁금한 건 공개 자료로 찾아보고, 우리 아이 일상이랑 같이 나눠요. 가끔은 이런 테스트도 만들어요 :)</p>
      <span class="btn" style="margin-top:6px">인스타그램에서 팔로우하기</span>
    </a>

    <p class="fine">참고: 로버트 기요사키, 『부자 아빠의 리치 패밀리』 3강 「어떤 사람이 되고 싶은지 선택하라」. 책의 개념을 바탕으로 동글마미가 만든 재미용 셀프체크이며, 심리검사나 재무 진단이 아니에요. 특정 금융상품을 권하지 않으며, 출판사·저자로부터 받은 광고나 협찬은 없어요(도서관에서 빌려 읽은 책).</p>
  </section>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll(".tr i").forEach(i=>i.style.width=i.dataset.w+"%")));
  document.getElementById("again").onclick = intro;
  document.getElementById("share").onclick = () => share(tops, score);
  window.scrollTo(0,0);
}

async function share(tops, score){
  gcTrack("esbi/share", "친구한테 보내기");
  const name = tops.length > 1 ? `${tops.join("·")} 하이브리드` : `${tops[0]} — ${TYPES[tops[0]].name}`;
  const text = `나는 ${name} 나왔어! (E${score.E} S${score.S} B${score.B} I${score.I})\n너는 어느 사분면이야? 2분이면 돼 👇`;
  const url = location.href.split("#")[0].split("?")[0];
  try{
    if(navigator.share){ await navigator.share({title:"우리 아이 부자 DNA 테스트 💰", text, url}); return; }
    await navigator.clipboard.writeText(text+"\n"+url);
    toast("링크를 복사했어요");
  }catch(e){ if(e && e.name!=="AbortError") toast("복사가 안 됐어요. 주소창 링크를 보내주세요"); }
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden=true, 1800);
}
intro();
</script>
<script>
// 방문자 측정(GoatCounter) 이벤트. 스크립트가 없거나 막혀도 아무 일도 안 한다
function gcTrack(p, t){ try { window.goatcounter && goatcounter.count && goatcounter.count({path:p, title:t, event:true}); } catch (e) {} }
</script>
<script data-goatcounter="https://youbeanko.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
